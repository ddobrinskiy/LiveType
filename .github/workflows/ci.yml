name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — nothing here needs to
# finish for a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      # wrangler and miniflare both declare engines >= 22, and the worker tests
      # now boot a real workerd to exercise D1, so 20 is no longer enough.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npx vitest run

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ensures the SDK licences are accepted so the Android Gradle plugin may
      # fetch platform 35 / build-tools 35.0.0 if the runner image lacks them.
      - uses: android-actions/setup-android@v3

      # ./gradlew is a bootstrap script that downloads Gradle itself; cache the
      # distribution alongside the usual dependency cache.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
